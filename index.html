<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Playlist 💘</title>
<style>
  /* Reset et style global */
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: #121212;
    color: white;
  }

  header {
    background: #1db954;
    padding: 20px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  h2 {
    margin: 20px 15px 10px;
    font-size: 20px;
    color: #b3b3b3;
    text-transform: uppercase;
  }

  .playlist {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 10px 20px;
  }

  .card {
    background: #181818;
    margin: 10px;
    width: 160px;
    border-radius: 8px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.2s;
    text-align: center;
  }

  .card:hover {
    transform: scale(1.05);
  }

  .card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
  }

  .card .title {
    font-size: 16px;
    margin: 8px 5px 4px;
    font-weight: bold;
  }

  .card .artist {
    font-size: 14px;
    margin-bottom: 8px;
    color: #b3b3b3;
  }

  @media (max-width: 500px) {
    .card {
      width: 45%;
    }
  }
</style>
</head>
<body>

<header>Notre Playlist 💘</header>

<h2>Love</h2>
<div class="playlist" id="Love"></div>

<h2>Chill</h2>
<div class="playlist" id="Chill"></div>

<script>
  const songs = [
    {id:1, title:"Perfect", artist:"Ed Sheeran", category:"Love", youtube:"https://www.youtube.com/watch?v=2Vv-BfVoq4g", img:"https://i.imgur.com/3C9bYMa.jpg"},
    {id:2, title:"Until I Found You", artist:"Stephen Sanchez", category:"Love", youtube:"https://www.youtube.com/watch?v=GxldQ9eX2wo", img:"https://i.imgur.com/V2kXy3v.jpg"},
    {id:3, title:"Blinding Lights", artist:"The Weeknd", category:"Chill", youtube:"https://www.youtube.com/watch?v=4NRXx6U8ABQ", img:"https://i.imgur.com/WtXJn8O.jpg"},
    {id:4, title:"Lose Yourself", artist:"Eminem", category:"Chill", youtube:"https://www.youtube.com/watch?v=_Yhyp-_hX2s", img:"https://i.imgur.com/7KjErU0.jpg"}
  ];

  function renderPlaylist() {
    songs.forEach(song => {
      const container = document.getElementById(song.category);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${song.img}" alt="${song.title}">
        <div class="title">${song.title}</div>
        <div class="artist">${song.artist}</div>
      `;
      card.onclick = () => window.open(song.youtube, "_blank");
      container.appendChild(card);
    });
  }

  renderPlaylist();
</script>

</body>
</html>
