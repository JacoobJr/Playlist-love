<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Playlist 💘</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #121212;
    color: #fff;
  }

  header {
    background-color: #1DB954;
    text-align: center;
    padding: 20px;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .category {
    margin: 20px 15px;
  }

  .category h2 {
    color: #b3b3b3;
    font-size: 18px;
    text-transform: uppercase;
    margin-bottom: 10px;
    border-bottom: 1px solid #333;
    padding-bottom: 5px;
  }

  .song {
    padding: 12px 15px;
    margin-bottom: 8px;
    background-color: #181818;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .song:hover {
    background-color: #1DB954;
    color: #121212;
  }

  .song .title {
    font-weight: bold;
    font-size: 16px;
  }

  .song .artist {
    font-size: 14px;
    color: #b3b3b3;
  }
</style>
</head>
<body>

<header>Notre Playlist 💘</header>

<div class="category">
  <h2>Love</h2>
  <div id="Love"></div>
</div>

<div class="category">
  <h2>Chill</h2>
  <div id="Chill"></div>
</div>

<script>
const songs = [
  {title:"Perfect", artist:"Ed Sheeran", category:"Love", youtube:"https://www.youtube.com/watch?v=2Vv-BfVoq4g"},
  {title:"Until I Found You", artist:"Stephen Sanchez", category:"Love", youtube:"https://www.youtube.com/watch?v=GxldQ9eX2wo"},
  {title:"Blinding Lights", artist:"The Weeknd", category:"Chill", youtube:"https://www.youtube.com/watch?v=4NRXx6U8ABQ"},
  {title:"Lose Yourself", artist:"Eminem", category:"Chill", youtube:"https://www.youtube.com/watch?v=_Yhyp-_hX2s"}
];

function renderPlaylist() {
  songs.forEach(song => {
    const container = document.getElementById(song.category);
    const div = document.createElement('div');
    div.className = 'song';
    div.innerHTML = `
      <div class="title">${song.title}</div>
      <div class="artist">${song.artist}</div>
    `;
    div.onclick = () => window.open(song.youtube, "_blank");
    container.appendChild(div);
  });
}

renderPlaylist();
</script>

</body>
</html>
