<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Playlist 💖</title>
<style>
body { margin:0; font-family:'Arial',sans-serif; background-color:#121212; color:#fff; overflow-x:hidden; padding-bottom:90px; }
header { background-color:#1DB954; text-align:center; padding:20px; font-size:24px; font-weight:bold; z-index:2; position:relative; }
.category { margin:20px 15px; position:relative; z-index:2; }
.category h2 { color:#b3b3b3; font-size:18px; text-transform:uppercase; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:5px; }

/* Slider Amour */
.slider { display:flex; gap:15px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:10px; }
.slider::-webkit-scrollbar { display:none; }
.album-card{ min-width:160px; flex:0 0 auto; scroll-snap-align:start; }
.album-image{ position:relative; width:160px; height:160px; border-radius:12px; overflow:hidden; cursor:pointer; }
.album-image img{ width:100%; height:100%; object-fit:cover; }
.album-heart{ position:absolute; top:8px; left:8px; width:24px; height:24px; }
.album-banner{ position:absolute; bottom:0; left:0; width:100%; padding:6px; font-size:13px; font-weight:bold; color:#fff; }
.album-desc{ margin-top:6px; font-size:13px; color:#b3b3b3; }
.album-like-heart{ position:absolute; font-size:50px; color:white; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); pointer-events:none; }

/* Playlist */
.song { padding:12px 15px; margin-bottom:8px; background-color:#181818; border-radius:8px; display:flex; justify-content:space-between; align-items:center; transition: background 0.2s; }
.song:hover { background-color:#1DB954; color:#121212; }
.info { display:flex; flex-direction:column; }
.title { font-weight:bold; font-size:16px; }
.artist { font-size:14px; color:#b3b3b3; }
.buttons { display:flex; gap:8px; }
button { border-radius:6px; padding:6px 12px; cursor:pointer; transition:all 0.2s; font-weight:bold; border:1px solid; }
.play-btn { background-color:#121212; color:#1DB954; border-color:#1DB954; }
.play-btn:hover { background-color:#1DB954; color:#121212; }
.yt-btn { background-color:#FF0000; color:#000; border-color:#FF0000; }
.yt-btn:hover { background-color:#CC0000; color:#000; }
audio { display:none; }

/* Particules */
#particleCanvas { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; }

/* LoveBox */
#loveBox { text-align:center; margin:40px 0; font-size:24px; font-weight:bold; color:#FF69B4; cursor:pointer; user-select:none; transition: transform 0.3s; z-index:2; position:relative; }

/* Dance */
#danceZone{ position: relative; display: flex; justify-content: center; gap: 30px; font-size: 60px; opacity:0; transition:opacity 0.3s ease; pointer-events: none; margin-top: 40px; margin-bottom: 60px; }
@keyframes danceGirl{ 0%,100%{transform:rotate(0deg);} 25%{transform:rotate(-15deg);} 50%{transform:rotate(10deg);} 75%{transform:rotate(-10deg);} }
@keyframes danceBoy{ 0%,100%{transform:rotate(0deg);} 25%{transform:rotate(15deg);} 50%{transform:rotate(-10deg);} 75%{transform:rotate(10deg);} }
#dancerGirl.animate{animation:danceGirl 0.5s infinite;}
#dancerBoy.animate{animation:danceBoy 0.5s infinite;}

/* Bottom nav */
.bottom-nav{ position:fixed; bottom:0; left:0; width:100%; height:70px; background:#181818; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #333; z-index:1000; }
.nav-item{ display:flex; flex-direction:column; align-items:center; font-size:12px; color:#fff; cursor:pointer; }
.nav-icon{ font-size:22px; margin-bottom:4px; }

/* Library popup */
#libraryPopup{ position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#1f1f1f; padding:20px; border-radius:15px; display:none; z-index:1500; width:80%; text-align:center; }
.lib-item{ margin:10px 0; cursor:pointer; }

/* Like heart animation */
.like-heart{ position:fixed; font-size:120px; color:white; left:50%; top:50%; transform:translate(-50%,-50%) scale(0); animation:pop 0.6s ease forwards; pointer-events:none; z-index:3000; }
@keyframes pop{ 0%{transform:translate(-50%,-50%) scale(0);} 50%{transform:translate(-50%,-50%) scale(1.2);} 100%{transform:translate(-50%,-50%) scale(1); opacity:0;} }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<header>Playlist AnaJay 💖</header>

<!-- Amour slider -->
<div class="category">
<h2>Amour</h2>
<div class="slider" id="AmourSlider"></div>
</div>

<!-- Playlist -->
<div class="category"><h2>Love</h2><div id="Love"></div></div>
<div class="category"><h2>Autre</h2><div id="Chill"></div></div>

<!-- Dance -->
<div id="danceZone">
  <span id="dancerGirl">💃</span>
  <span id="dancerBoy">🕺</span>
</div>

<!-- Bottom nav -->
<div class="bottom-nav">
  <div class="nav-item" onclick="scrollToTop()"><div class="nav-icon">🏠</div>Accueil</div>
  <div class="nav-item"><div class="nav-icon">🔍</div>Recherche</div>
  <div class="nav-item" onclick="toggleLibrary()"><div class="nav-icon">📚</div>Bibliothèque</div>
  <div class="nav-item" onclick="spawnHeart()"><div class="nav-icon">❤</div>Like</div>
</div>

<div id="libraryPopup"><div class="lib-item" onclick="goToCategory('Love')">Love</div><div class="lib-item" onclick="goToCategory('Chill')">Autre</div></div>

<script>
// --- PARTICULES ---
const canvas=document.getElementById('particleCanvas'),ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;
let particles=[],particleActive=false;window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
function drawHeart(ctx,x,y,size,color){ctx.save();ctx.translate(x,y);ctx.beginPath();const h=size*0.3;ctx.moveTo(0,h);ctx.bezierCurveTo(0,0,-size/2,0,-size/2,h);ctx.bezierCurveTo(-size/2,size/2,0,size*0.75,0,size);ctx.bezierCurveTo(0,size*0.75,size/2,size/2,size/2,h);ctx.bezierCurveTo(size/2,0,0,0,0,h);ctx.fillStyle=color;ctx.fill();ctx.restore();}
class HeartParticle{constructor(){this.reset();}reset(){this.x=Math.random()*canvas.width;this.y=canvas.height+Math.random()*50;this.size=Math.random()*10+5;this.speedY=Math.random()*1+0.5;this.speedX=(Math.random()-0.5)*0.5;this.alpha=Math.random()*0.5+0.5;this.color=`rgba(255,0,128,${this.alpha})`;}update(){this.y-=this.speedY;this.x+=this.speedX;this.alpha-=0.002;if(this.y<-10||this.alpha<=0)this.reset();}draw(){drawHeart(ctx,this.x,this.y,this.size,this.color);}}
function animateParticles(){ctx.clearRect(0,0,canvas.width,canvas.height);if(particleActive){if(particles.length<100)particles.push(new HeartParticle());particles.forEach(p=>{p.update();p.draw();});}requestAnimationFrame(animateParticles);}
animateParticles();

// --- DANCE ---
const danceZone=document.getElementById('danceZone'),dancerGirl=document.getElementById('dancerGirl'),dancerBoy=document.getElementById('dancerBoy');
function showDance(){danceZone.style.opacity=1;dancerGirl.classList.add("animate");dancerBoy.classList.add("animate");}
function hideDance(){danceZone.style.opacity=0;dancerGirl.classList.remove("animate");dancerBoy.classList.remove("animate");}

// --- LOVE BOX ---
const loveWords=["Je t'aime Anaelle 💘","Mon cœur ❤️","Mon amour 💕","Mon ange ☀️","Tu es magique ✨","Ma chérie 💓","Mon petit bonheur 🥰","Love you biloute 🤡💖"];
const loveBox=document.createElement('div');loveBox.id='loveBox';loveBox.textContent='💖 Tapote-moi 💖';
loveBox.addEventListener('click',()=>{let w=loveWords[Math.floor(Math.random()*loveWords.length)];loveBox.textContent=w;loveBox.style.transform="scale(1.2)";setTimeout(()=>{loveBox.style.transform="scale(1)";},300);});
loveBox.addEventListener('touchstart',()=>{let w=loveWords[Math.floor(Math.random()*loveWords.length)];loveBox.textContent=w;loveBox.style.transform="scale(1.2)";setTimeout(()=>{loveBox.style.transform="scale(1)";},300);});

// --- PLAYLIST ---
const songs=[
{title:"Perfect", artist:"Ed Sheeran", category:"Love", file:"perfect.mp3", youtube:"https://www.youtube.com/watch?v=2Vv-BfVoq4g"},
{title:"Imagine", artist:"Carbone", category:"Love", file:"imagine_carbone.mp3", youtube:"https://www.youtube.com/watch?v=iuSUZyTWi6o"},
{title:"Nanani", artist:"Gazo", category:"Love", file:"nanani.mp3", youtube:"https://www.youtube.com/watch?v=8Bkgi6yB6P8"},
{title:"Angela", artist:"Hatik", category:"Love", file:"angela.mp3", youtube:"https://www.youtube.com/watch?v=uqsGUAM9WDk"},
{title:"Bebe de Bogoda", artist:"Moha la Squale", category:"Love", file:"bebe_de_bogoda.mp3", youtube:"https://www.youtube.com/watch?v=oW-xRDJhoqo"},
{title:"Ma Belle", artist:"Moha La Squale", category:"Love", file:"ma_belle_moha_la_squale.mp3", youtube:"https://www.youtube.com/watch?v=NsxdxA_j8nk"},
{title:"Luna", artist:"Moha La Squale", category:"Love", file:"luna_moha_la_squale.mp3", youtube:"https://www.youtube.com/watch?v=qJZy8zy0Uy0"},
{title:"Jaloux", artist:"Dadju", category:"Love", file:"dadju_jaloux.mp3", youtube:"https://www.youtube.com/watch?v=254EHfv9RvM"},
{title:"Lettre à une femme", artist:"Ninho", category:"Love", file:"lettre_a_une_femme_ninho.mp3", youtube:"https://www.youtube.com/watch?v=ifNfpzkoY9s"},
{title:"Jolie Bébé", artist:"Naza", category:"Love", file:"jolie_bebe_naza.mp3", youtube:"https://www.youtube.com/watch?v=sTp7C41iY6M"},
{title:"Mon Bébé", artist:"RnBoi", category:"Love", file:"mon_bebe_rnboi.mp3", youtube:"https://www.youtube.com/watch?v=U2t5Y89I2tE"},
{title:"Solide", artist:"Ronisia", category:"Love", file:"solide_ronisia.mp3", youtube:"https://www.youtube.com/watch?v=RHOhrdsGOc0"},
{title:"Soleil Bleu", artist:"Luiza", category:"Love", file:"soleil_bleu_luiza.mp3", youtube:"https://www.youtube.com/watch?v=nd8RD3tjNQE"},
];
let currentAudio=null,currentBtn=null;
function renderPlaylist(){const container=document.getElementById('Love');songs.forEach((song)=>{
const div=document.createElement('div');div.className='song';
div.innerHTML=`<div class="info"><div class="title">${song.title}</div><div class="artist">${song.artist}</div></div><div class="buttons"><button class="play-btn">▶ Play</button><button class="yt-btn" onclick="window.open('${song.youtube}','_blank')">YouTube</button><audio src="${song.file}"></audio></div>`;
container.appendChild(div);if(song.title==="Ma Belle"){container.appendChild(loveBox);}
const playBtn=div.querySelector('.play-btn');const audio=div.querySelector('audio');
playBtn.addEventListener('click',()=>{
if(currentAudio===audio){if(!audio.paused){audio.pause();playBtn.textContent='▶ Play';particleActive=false;hideDance();}else{audio.play();playBtn.textContent='⏸ Pause';particleActive=true;showDance();}}else{if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;if(currentBtn)currentBtn.textContent='▶ Play';}audio.play();playBtn.textContent='⏸ Pause';currentAudio=audio;currentBtn=playBtn;particleActive=true;showDance();}});
audio.addEventListener('ended',()=>{playBtn.textContent='▶ Play';particleActive=false;hideDance();if(currentAudio===audio){currentAudio=null;currentBtn=null;}});
});}
renderPlaylist();

// --- Bottom nav functions ---
function spawnHeart(){const heart=document.createElement('div');heart.className='like-heart';document.body.appendChild(heart);setTimeout(()=>{document.body.removeChild(heart);},600);}
function scrollToTop(){window.scrollTo({top:0,behavior:"smooth"});}
function toggleLibrary(){const lib=document.getElementById('libraryPopup');lib.style.display=(lib.style.display==='none'||lib.style.display==='')?'block':'none';}
function goToCategory(id){const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:"smooth"});toggleLibrary();}}
</script>
</body>
</html>
