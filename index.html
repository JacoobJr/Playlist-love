<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Playlist 💘</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #121212;
    color: #fff;
  }

  header {
    background-color: #1DB954;
    text-align: center;
    padding: 20px;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .category {
    margin: 20px 15px;
  }

  .category h2 {
    color: #b3b3b3;
    font-size: 18px;
    text-transform: uppercase;
    margin-bottom: 10px;
    border-bottom: 1px solid #333;
    padding-bottom: 5px;
  }

  .song {
    padding: 12px 15px;
    margin-bottom: 8px;
    background-color: #181818;
    border-radius: 8px;
    cursor: default;
    transition: background 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .song:hover {
    background-color: #1DB954;
    color: #121212;
  }

  .song .info {
    display: flex;
    flex-direction: column;
  }

  .song .title {
    font-weight: bold;
    font-size: 16px;
  }

  .song .artist {
    font-size: 14px;
    color: #b3b3b3;
  }

  button {
    background-color: #121212;
    color: #1DB954;
    border: 1px solid #1DB954;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  button:hover {
    background-color: #1DB954;
    color: #121212;
  }

  audio {
    width: 100%;
    margin-top: 5px;
    display: none;
  }
</style>
</head>
<body>

<header>Notre Playlist 💘</header>

<div class="category">
  <h2>Love</h2>
  <div id="Love"></div>
</div>

<div class="category">
  <h2>Chill</h2>
  <div id="Chill"></div>
</div>

<script>
const songs = [
  {title:"Perfect", artist:"Ed Sheeran", category:"Love", file:"audio/perfect.mp3"},
  {title:"Until I Found You", artist:"Stephen Sanchez", category:"Love", file:"audio/until_i_found_you.mp3"},
  {title:"Blinding Lights", artist:"The Weeknd", category:"Chill", file:"audio/blinding_lights.mp3"},
  {title:"Lose Yourself", artist:"Eminem", category:"Chill", file:"audio/lose_yourself.mp3"}
];

function renderPlaylist() {
  songs.forEach(song => {
    const container = document.getElementById(song.category);
    const div = document.createElement('div');
    div.className = 'song';
    div.innerHTML = `
      <div class="info">
        <div class="title">${song.title}</div>
        <div class="artist">${song.artist}</div>
      </div>
      <div>
        <button onclick="playAudio(this, '${song.file}')">▶ Play</button>
        <audio src="${song.file}"></audio>
      </div>
    `;
    container.appendChild(div);
  });
}

function playAudio(btn, src) {
  // stop all other audios
  document.querySelectorAll('audio').forEach(a => a.pause());
  document.querySelectorAll('audio').forEach(a => a.currentTime = 0);

  const audio = btn.nextElementSibling;
  audio.style.display = 'block';
  audio.play();
}

renderPlaylist();
</script>

</body>
</html>
