<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Playlist 💖</title>
<style>
  body { margin:0; font-family:'Arial',sans-serif; background-color:#121212; color:#fff; overflow-x:hidden; }
  header { background-color:#1DB954; text-align:center; padding:20px; font-size:24px; font-weight:bold; z-index:2; position:relative; }

  .category { margin:30px 15px; position:relative; z-index:2; }
  .category h2 { 
    color:#fff; 
    font-size:20px; 
    margin-bottom:15px; 
    font-weight:bold;
  }

  /* ===== SLIDER AMOUR ===== */

  .slider {
    display:flex;
    gap:15px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding-bottom:10px;
  }

  .slider::-webkit-scrollbar { display:none; }

  .album-card{
    min-width:160px;
    flex:0 0 auto;
    scroll-snap-align:start;
  }

  .album-image{
    position:relative;
    width:160px;
    height:160px;
    border-radius:12px;
    overflow:hidden;
  }

  .album-image img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .album-heart{
    position:absolute;
    top:8px;
    left:8px;
    font-size:20px;
  }

  .album-banner{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    padding:6px;
    font-size:13px;
    font-weight:bold;
    color:#fff;
  }

  .album-desc{
    margin-top:6px;
    font-size:13px;
    color:#b3b3b3;
  }

  /* ===== PLAYLIST ===== */

  .song { 
    padding:14px; 
    margin-bottom:10px; 
    background-color:#181818; 
    border-radius:12px; 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    transition: background 0.2s; 
  }

  .song:hover { background-color:#1f1f1f; }

  .info { display:flex; flex-direction:column; }
  .title { font-weight:bold; font-size:16px; }
  .artist { font-size:14px; color:#b3b3b3; }

  .buttons { display:flex; gap:8px; }

  button { 
    border-radius:20px; 
    padding:6px 14px; 
    cursor:pointer; 
    font-weight:bold; 
    border:none;
  }

  .play-btn { background-color:#1DB954; color:#000; }
  .yt-btn { background-color:#FF0000; color:#000; }

  audio { display:none; }

  /* Canvas */
  #particleCanvas {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:1;
  }

  #loveBox {
    text-align:center;
    margin:40px 0;
    font-size:24px;
    font-weight:bold;
    color:#FF69B4;
    cursor:pointer;
    user-select:none;
    transition: transform 0.3s;
    z-index:2;
    position:relative;
  }

  #danceZone{
    position: relative;
    display: flex;
    justify-content: center;
    gap: 30px;
    font-size: 60px;
    opacity:0;
    transition:opacity 0.3s ease;
    pointer-events: none;
    margin-top: 40px;
    margin-bottom: 60px;
  }

  @keyframes danceGirl{
    0%,100%{transform:rotate(0deg);}
    25%{transform:rotate(-15deg);}
    50%{transform:rotate(10deg);}
    75%{transform:rotate(-10deg);}
  }

  @keyframes danceBoy{
    0%,100%{transform:rotate(0deg);}
    25%{transform:rotate(15deg);}
    50%{transform:rotate(-10deg);}
    75%{transform:rotate(10deg);}
  }

  #dancerGirl.animate{animation:danceGirl 0.5s infinite;}
  #dancerBoy.animate{animation:danceBoy 0.5s infinite;}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<header>Playlist AnaJay 💖</header>

<!-- ===== NOUVELLE SECTION AMOUR ===== -->

<div class="category">
  <h2>Amour</h2>
  <div class="slider">

    <div class="album-card">
      <div class="album-image">
        <span class="album-heart">❤️</span>
        <img src="image-1.jpg">
        <div class="album-banner" style="background:#E91E63;">Notre Début</div>
      </div>
      <div class="album-desc">Le premier regard 💫</div>
    </div>

    <div class="album-card">
      <div class="album-image">
        <span class="album-heart">❤️</span>
        <img src="image-2.jpg">
        <div class="album-banner" style="background:#9C27B0;">Nos Moments</div>
      </div>
      <div class="album-desc">Les souvenirs précieux 💕</div>
    </div>

    <div class="album-card">
      <div class="album-image">
        <span class="album-heart">❤️</span>
        <img src="image-3.jpg">
        <div class="album-banner" style="background:#3F51B5;">Toujours Nous</div>
      </div>
      <div class="album-desc">Pour la vie 💍</div>
    </div>

  </div>
</div>

<!-- ===== PLAYLIST ===== -->

<div class="category">
  <h2>Love</h2>
  <div id="Love"></div>
</div>

<div class="category">
  <h2>Autre</h2>
  <div id="Chill"></div>
</div>

<div id="danceZone">
  <span id="dancerGirl">💃</span>
  <span id="dancerBoy">🕺</span>
</div>
