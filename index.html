<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Playlist 💖</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#121212;
  color:white;
  overflow-x:hidden;
}

header{
  background:#1DB954;
  text-align:center;
  padding:20px;
  font-size:24px;
  font-weight:bold;
  position:relative;
  z-index:2;
}

.category{
  margin:20px 15px;
  position:relative;
  z-index:2;
}

.category h2{
  color:#b3b3b3;
  font-size:18px;
  text-transform:uppercase;
  margin-bottom:10px;
  border-bottom:1px solid #333;
  padding-bottom:5px;
}

.song{
  padding:12px 15px;
  margin-bottom:8px;
  background:#181818;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:0.2s;
}

.song:hover{
  background:#1DB954;
  color:#121212;
}

.info{
  display:flex;
  flex-direction:column;
}

.title{font-weight:bold;}
.artist{font-size:14px;color:#b3b3b3;}

button{
  border-radius:6px;
  padding:6px 12px;
  cursor:pointer;
  font-weight:bold;
  border:1px solid;
}

.play-btn{
  background:#121212;
  color:#1DB954;
  border-color:#1DB954;
}

.yt-btn{
  background:#FF0000;
  border-color:#FF0000;
}

audio{display:none;}

#particleCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1;
}

/* ❤️ DANSE */

#danceZone{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:30px;
  font-size:60px;
  opacity:0;
  transition:0.3s;
  z-index:3;
}

@keyframes danceGirl{
  0%,100%{transform:rotate(0deg) translateY(0);}
  25%{transform:rotate(-15deg) translateY(-5px);}
  50%{transform:rotate(10deg) translateY(0);}
  75%{transform:rotate(-10deg) translateY(-5px);}
}

@keyframes danceBoy{
  0%,100%{transform:rotate(0deg) translateY(0);}
  25%{transform:rotate(15deg) translateY(-5px);}
  50%{transform:rotate(-10deg) translateY(0);}
  75%{transform:rotate(10deg) translateY(-5px);}
}

#dancerGirl.animate{animation:danceGirl 0.5s infinite;}
#dancerBoy.animate{animation:danceBoy 0.5s infinite;}
</style>
</head>

<body>

<canvas id="particleCanvas"></canvas>

<header>Playlist AnaJay 💖</header>

<div class="category">
<h2>Love</h2>
<div id="Love"></div>
</div>

<div class="category">
<h2>Autre</h2>
<div id="Chill"></div>
</div>

<script>

const songs=[
{title:"Perfect",artist:"Ed Sheeran",category:"Love",file:"perfect.mp3",youtube:"https://www.youtube.com/watch?v=2Vv-BfVoq4g"},
{title:"Imagine",artist:"Carbone",category:"Love",file:"imagine_carbone.mp3",youtube:"https://www.youtube.com/watch?v=iuSUZyTWi6o"},
{title:"Nanani",artist:"Gazo",category:"Love",file:"nanani.mp3",youtube:"https://www.youtube.com/watch?v=8Bkgi6yB6P8"},
{title:"Angela",artist:"Hatik",category:"Love",file:"angela.mp3",youtube:"https://www.youtube.com/watch?v=uqsGUAM9WDk"},
{title:"Bebe de Bogoda",artist:"Moha la Squale",category:"Love",file:"bebe_de_bogoda.mp3",youtube:"https://www.youtube.com/watch?v=oW-xRDJhoqo"},
{title:"Ma Belle",artist:"Moha La Squale",category:"Love",file:"ma_belle_moha_la_squale.mp3",youtube:"https://www.youtube.com/watch?v=NsxdxA_j8nk"},
{title:"Luna",artist:"Moha La Squale",category:"Love",file:"luna_moha_la_squale.mp3",youtube:"https://www.youtube.com/watch?v=qJZy8zy0Uy0"},
{title:"Jaloux",artist:"Dadju",category:"Love",file:"dadju_jaloux.mp3",youtube:"https://www.youtube.com/watch?v=254EHfv9RvM"},
{title:"Lettre à une femme",artist:"Ninho",category:"Love",file:"lettre_a_une_femme_ninho.mp3",youtube:"https://www.youtube.com/watch?v=ifNfpzkoY9s"},
{title:"Jolie Bébé",artist:"Naza",category:"Love",file:"jolie_bebe_naza.mp3",youtube:"https://www.youtube.com/watch?v=sTp7C41iY6M"},
{title:"Mon Bébé",artist:"RnBoi",category:"Love",file:"mon_bebe_rnboi.mp3",youtube:"https://www.youtube.com/watch?v=U2t5Y89I2tE"},
{title:"Solide",artist:"Ronisia",category:"Love",file:"solide_ronisia.mp3",youtube:"https://www.youtube.com/watch?v=RHOhrdsGOc0"},
{title:"Soleil Bleu",artist:"Luiza",category:"Love",file:"soleil_bleu_luiza.mp3",youtube:"https://www.youtube.com/watch?v=nd8RD3tjNQE"},
{title:"Lose Yourself",artist:"Eminem",category:"Chill",file:"lose_yourself.mp3",youtube:"https://www.youtube.com/watch?v=_Yhyp-_hX2s"}
];

let currentAudio=null;
let currentBtn=null;

const danceZone=document.createElement("div");
danceZone.id="danceZone";
danceZone.innerHTML=`<span id="dancerGirl">💃</span><span id="dancerBoy">🕺</span>`;
document.body.appendChild(danceZone);

const dancerGirl=document.getElementById("dancerGirl");
const dancerBoy=document.getElementById("dancerBoy");

function showDance(){
danceZone.style.opacity=1;
dancerGirl.classList.add("animate");
dancerBoy.classList.add("animate");
}

function hideDance(){
danceZone.style.opacity=0;
dancerGirl.classList.remove("animate");
dancerBoy.classList.remove("animate");
}

/* ❤️ PARTICULES */
const canvas=document.getElementById("particleCanvas");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
let particleActive=false;

class Heart{
constructor(){this.reset();}
reset(){
this.x=Math.random()*canvas.width;
this.y=canvas.height+20;
this.size=Math.random()*10+5;
this.speedY=Math.random()*1+0.5;
this.alpha=1;
}
update(){
this.y-=this.speedY;
this.alpha-=0.01;
if(this.alpha<=0)this.reset();
}
draw(){
ctx.globalAlpha=this.alpha;
ctx.fillStyle="pink";
ctx.beginPath();
ctx.arc(this.x,this.y,this.size/2,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha=1;
}
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
if(particleActive){
if(particles.length<80)particles.push(new Heart());
particles.forEach(p=>{p.update();p.draw();});
}
requestAnimationFrame(animate);
}
animate();

/* PLAYLIST */
function render(){
songs.forEach(song=>{
const container=document.getElementById(song.category);
const div=document.createElement("div");
div.className="song";
div.innerHTML=`
<div class="info">
<div class="title">${song.title}</div>
<div class="artist">${song.artist}</div>
</div>
<div>
<button class="play-btn">▶ Play</button>
<button class="yt-btn" onclick="window.open('${song.youtube}')">YouTube</button>
<audio src="${song.file}"></audio>
</div>`;
container.appendChild(div);

const btn=div.querySelector(".play-btn");
const audio=div.querySelector("audio");

btn.addEventListener("click",()=>{
if(currentAudio&&currentAudio!==audio){
currentAudio.pause();
currentAudio.currentTime=0;
currentBtn.textContent="▶ Play";
}

if(audio.paused){
audio.play();
btn.textContent="⏸ Pause";
currentAudio=audio;
currentBtn=btn;
particleActive=true;
showDance();
}else{
audio.pause();
btn.textContent="▶ Play";
particleActive=false;
hideDance();
}
});

audio.addEventListener("ended",()=>{
btn.textContent="▶ Play";
particleActive=false;
hideDance();
});
});
}

render();
</script>

</body>
</html>
