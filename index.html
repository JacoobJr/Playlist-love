<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Playlist 💘</title>
<style>
  body { margin:0; font-family:'Arial',sans-serif; background-color:#121212; color:#fff; }
  header { background-color:#1DB954; text-align:center; padding:20px; font-size:24px; font-weight:bold; }
  .category { margin:20px 15px; }
  .category h2 { color:#b3b3b3; font-size:18px; text-transform:uppercase; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:5px; }
  .song { padding:12px 15px; margin-bottom:8px; background-color:#181818; border-radius:8px; display:flex; justify-content:space-between; align-items:center; transition: background 0.2s; }
  .song:hover { background-color:#1DB954; color:#121212; }
  .info { display:flex; flex-direction:column; }
  .title { font-weight:bold; font-size:16px; }
  .artist { font-size:14px; color:#b3b3b3; }
  .buttons { display:flex; gap:8px; }
  button { border-radius:6px; padding:6px 12px; cursor:pointer; transition:all 0.2s; font-weight:bold; border:1px solid; }
  .play-btn { background-color:#121212; color:#1DB954; border-color:#1DB954; }
  .play-btn:hover { background-color:#1DB954; color:#121212; }
  .yt-btn { background-color:#FF0000; color:#000; border-color:#FF0000; }
  .yt-btn:hover { background-color:#CC0000; color:#000; }
  audio { display:none; }
</style>
</head>
<body>

<header>Notre Playlist 💘</header>

<div class="category">
  <h2>Love</h2>
  <div id="Love"></div>
</div>

<div class="category">
  <h2>Chill</h2>
  <div id="Chill"></div>
</div>

<script>
const songs = [
  // LOVE
  {title:"Perfect", artist:"Ed Sheeran", category:"Love", file:"perfect.mp3", youtube:"https://www.youtube.com/watch?v=2Vv-BfVoq4g"},
  {title:"Imagine Carbone", artist:"Gazo", category:"Love", file:"imagine_carbone_gazo.mp3", youtube:"https://www.youtube.com/watch?v=XVNuLd3owis"}, /* Gazo – Nanani Nanana clip officiel */ :contentReference[oaicite:0]{index=0}
  {title:"Angela", artist:"Hatik", category:"Love", file:"angela_hatik.mp3", youtube:"https://www.youtube.com/watch?v=uqsGUAM9WDk"}, /* Hatik – Angela */ :contentReference[oaicite:1]{index=1}
  {title:"Bébé de Bogota", artist:"Moha La Squale", category:"Love", file:"bebe_de_bogota_moha_la_squale.mp3", youtube:"https://www.youtube.com/results?search_query=Moha+La+Squale+B%C3%A9b%C3%A9+de+Bogota"}, /* pas de clip officiel clair */ :contentReference[oaicite:2]{index=2}
  {title:"Ma Belle", artist:"Moha La Squale", category:"Love", file:"ma_belle_moha_la_squale.mp3", youtube:"https://www.youtube.com/watch?v=NsxdxA_j8nk"}, /* Moha La Squale – Ma belle */ :contentReference[oaicite:3]{index=3}
  {title:"Luna", artist:"Moha La Squale", category:"Love", file:"luna_moha_la_squale.mp3", youtube:"https://www.youtube.com/results?search_query=Moha+La+Squale+Luna"}, /* clip non identifié */ :contentReference[oaicite:4]{index=4}
  {title:"Lettre à une femme", artist:"Ninho", category:"Love", file:"lettre_a_une_femme_ninho.mp3", youtube:"https://www.youtube.com/watch?v=q_WVvnOJmhs"}, /* Ninho – Lettre à une femme */ :contentReference[oaicite:5]{index=5}
  {title:"Joli Bébé", artist:"Naza", category:"Love", file:"joli_bebe_naza.mp3", youtube:"https://www.youtube.com/watch?v=ZycMJWv2vtY"}, /* Naza ft Niska – Joli Bébé */ :contentReference[oaicite:6]{index=6}
  {title:"Mon Bébé", artist:"RnBoi", category:"Love", file:"mon_bebe_rnboi.mp3", youtube:"https://www.youtube.com/watch?v=U2t5Y89I2tE"}, /* RnBoi – Mon Bébé (clip officiel) */ :contentReference[oaicite:7]{index=7}
  {title:"Solide", artist:"Ronisia", category:"Love", file:"solide_ronisia.mp3", youtube:"https://www.youtube.com/results?search_query=Ronisia+Solide"}, /* pas de clip officiel clair */ 
  {title:"Soleil Bleu", artist:"Bleu Soleil & Luiza", category:"Love", file:"soleil_bleu_luiza.mp3", youtube:"https://www.youtube.com/watch?v=uz6sARD5XCU"}, /* Bleu Soleil x Luiza – Soleil bleu clip */ :contentReference[oaicite:8]{index=8}

  // CHILL
  {title:"Blinding Lights", artist:"The Weeknd", category:"Chill", file:"blinding_lights.mp3", youtube:"https://www.youtube.com/watch?v=4NRXx6U8ABQ"},
  {title:"Lose Yourself", artist:"Eminem", category:"Chill", file:"lose_yourself.mp3", youtube:"https://www.youtube.com/watch?v=_Yhyp-_hX2s"}
];

let currentAudio = null;
let currentBtn = null;

function renderPlaylist() {
  songs.forEach(song => {
    const container = document.getElementById(song.category);
    const div = document.createElement('div');
    div.className = 'song';
    div.innerHTML = `
      <div class="info">
        <div class="title">${song.title}</div>
        <div class="artist">${song.artist}</div>
      </div>
      <div class="buttons">
        <button class="play-btn">▶ Play</button>
        <button class="yt-btn" onclick="window.open('${song.youtube}', '_blank')">YouTube</button>
        <audio src="${song.file}"></audio>
      </div>
    `;
    container.appendChild(div);

    const playBtn = div.querySelector('.play-btn');
    const audio = div.querySelector('audio');

    playBtn.addEventListener('click', () => {
      if (currentAudio === audio) {
        if (!audio.paused) {
          audio.pause();
          playBtn.textContent = '▶ Play';
        } else {
          audio.play();
          playBtn.textContent = '⏸ Pause';
        }
      } else {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          if (currentBtn) currentBtn.textContent = '▶ Play';
        }
        audio.play();
        playBtn.textContent = '⏸ Pause';
        currentAudio = audio;
        currentBtn = playBtn;
      }
    });

    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶ Play';
      if (currentAudio === audio) {
        currentAudio = null;
        currentBtn = null;
      }
    });
  });
}

renderPlaylist();
</script>

</body>
</html>
